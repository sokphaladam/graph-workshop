extend type Query {
  tableSetList(limit: Int = 25, offset: Int = 0): [TableSet]
  tableSet(id: Int!): TableSet
}

extend type Mutation {
  generateTableSet(sets: Int!): Boolean
  swapOrderTable(orderId: Int!, table: String): Boolean
  configureTableSet(data: [ConfigureTableSetInput]): Boolean
}

type TableSet {
  set: Int
  fake: Boolean
  order: Order
  floor: String
}

input ConfigureTableSetInput {
  floor: String!
  rangeStart: Int!
  rangeEnd: Int!
}
